- binary_sensor:
    - name: "Grid"
      unique_id: main_grid_power_status
      state: >
        {{ is_state("binary_sensor.wicket_wiket_status", "on") }}
      icon: >
          {% if is_state("binary_sensor.grid", "on") -%}
            mdi:transmission-tower
          {%- else -%}
            mdi:transmission-tower-off
          {%- endif %}  
        
    - name: "Station"
      state: >
        {{ is_state('binary_sensor.power_monitor_power_meter_status', 'on') and is_state('binary_sensor.grid', 'off') and is_state('binary_sensor.charger', 'off') }}
      icon: >
          mdi:home-battery
        
    - name: "Generator"
      state: >
        {{ is_state('binary_sensor.power_monitor_power_meter_status', 'on') and is_state('binary_sensor.grid', 'off') and is_state('binary_sensor.charger', 'on') }}
      icon: >
          mdi:generator-stationary

    - name: "Backup Power Overload"
      unique_id: backup_power_overload
      state: >
        {% set grid_off = is_state('binary_sensor.grid', 'off') %}
        {% set power = states('sensor.power_monitor_pmeter_power') | float(0) %}
        {% set high_load = power > 1000 %}
        {% set overload_now = power > 2000 %}
        {% set five_minutes = 300 %}
        {% set elapsed = as_timestamp(now()) - as_timestamp(states.binary_sensor.backup_power_overload.last_changed) %}

        {{
          grid_off
          and (
                overload_now
                or
                (high_load and elapsed > five_minutes)
              )
        }}
      icon: >
        {% if is_state('binary_sensor.backup_power_overload', 'on') %}
          mdi:alert
        {% else %}
          mdi:check-circle-outline
        {% endif %}
          
- trigger:
    - platform: time_pattern
      seconds: /30
  action:
    - action: zha_toolkit.ieee_ping
      data:
        ieee: 00:15:8d:00:01:dc:0a:94
      response_variable: result
    - variables:
        online: >-
          {{ (result.success) }}
  binary_sensor:
    - name: 'Charger'
      state: >-
        {{ online }}
      device_class: connectivity
      
- sensor:
    - name: 'Charger power'
      unit_of_measurement: "W"
      state: >-
        {% if is_state("binary_sensor.charger", "on") -%}
          {{ states('sensor.lumi_lumi_plug_power') }}
        {%- else -%}
          0
        {%- endif %}   
      
- sensor:
    - name: 'Total power'
      unit_of_measurement: "W"
      state: >-
        {{ states('sensor.power_monitor_pmeter_power')|float + states('sensor.charger_power')|float}}
        
    - name: "Next Power Restoration"
      state: >-
        {% set v = states('sensor.kyiv_region_6_1_next_connectivity') %}
        {% if v in ['unknown', 'unavailable', 'none'] %}
          unknown
        {% else %}
          {% set dt = as_datetime(v) | as_local %}
          {% set today = now().date() %}
          {% set tomorrow = (now() + timedelta(days=1)).date() %}
          {% set time_str = dt.strftime('%H:%M') %}

          {% if dt.date() == today %}
            today at {{ time_str }}
          {% elif dt.date() == tomorrow %}
            tomorrow at {{ time_str }}
          {% else %}
            {{ dt.strftime('%A') }} at {{ time_str }}
          {% endif %}
        {% endif %}
        
    - name: "Next Planned Outage"
      state: >-
          {% set v = states('sensor.kyiv_region_6_1_next_planned_outage') %}
          {% if v in ['unknown', 'unavailable', 'none'] %}
            unknown
          {% else %}
            {% set dt = as_datetime(v) | as_local %}
            {% set today = now().date() %}
            {% set tomorrow = (now() + timedelta(days=1)).date() %}
            {% set time_str = dt.strftime('%H:%M') %}

            {% if dt.date() == today %}
              today at {{ time_str }}
            {% elif dt.date() == tomorrow %}
              tomorrow at {{ time_str }}
            {% else %}
              {{ dt.strftime('%A') }} at {{ time_str }}
            {% endif %}
          {% endif %}    

- trigger:
    - platform: time_pattern
      minutes: "*"
  sensor:
    - name: "Alert Run Time"
      icon: "mdi:clock-end"
      device_class: "duration"
      state: >
            {{ (as_timestamp(now())|float - as_timestamp(states.binary_sensor.velikodimerska_teritorialna_gromada_air.last_changed)|float) |round(0)}}
      unit_of_measurement: "Sec"
  

        