- id: '1767108611852'
  alias: Power save on emergency outages
  description: Smart management of power scenes based on Grid/Generator status
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.grid
    - binary_sensor.generator
    from: 'on'
    to: 'off'
    for: 00:05:00
    id: power_lost
  - trigger: state
    entity_id:
    - binary_sensor.grid
    - binary_sensor.generator
    from: 'off'
    to: 'on'
    for: 00:05:00
    id: power_restored
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: power_lost
      - condition: state
        entity_id: binary_sensor.grid
        state: 'off'
      - condition: state
        entity_id: binary_sensor.generator
        state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.emergency_shutdown
    - conditions:
      - condition: trigger
        id: power_restored
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.grid
          state: 'on'
        - condition: state
          entity_id: binary_sensor.generator
          state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.restore_power
  mode: single
