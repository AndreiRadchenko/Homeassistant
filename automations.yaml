- id: zha_ping_charger
  alias: Ping Charger via ZHA Toolkit
  description: Updates charger connectivity helper without crashing on timeouts.
  triggers:
  - trigger: time_pattern
    minutes: /1
  actions:
  - target:
      entity_id: input_boolean.charger_online
    action: input_boolean.turn_off
  - action: zha_toolkit.ieee_ping
    data:
      ieee: 00:15:8d:00:01:dc:0a:94
    response_variable: result
    continue_on_error: true
  - condition: template
    value_template: '{{ result is defined and result.success }}'
  - target:
      entity_id: input_boolean.charger_online
    action: input_boolean.turn_on
  mode: restart
- id: ai_voice_commander
  alias: AI Voice Commander (Smart + Native Fallback)
  triggers:
  - command:
    - '{{ trigger.user_input.text }}'
    trigger: conversation
  actions:
  - sequence:
    - action: ai_task.generate_data
      data:
        task_name: parse_complex_intent
        entity_id: ai_task.openai_ai_task
        instructions: "Current time: {{ now() }}. INPUT REQUEST (ignore the leading
          words \"будь ласка\"): {{ trigger.user_input.text }} Your task is to analyze
          the user's natural language request and convert it into structured data
          for Home Assistant.\n### AVAILABLE DEVICES (Use ONLY these entity_ids):
          {%- for state in states if state.domain in ['light', 'switch', 'cover',
          'climate', 'lock', 'scene', 'script'] %} - {{ state.name }}: {{ state.entity_id
          }} {%- endfor %}\n### CLASSIFICATION RULES (intent_type): 1. **\"command\"**:
          Use if the request contains a time delay (\"in 10 minutes\") or a duration
          (\"for 5 minutes\").\n   - Example \"for 5 min\": immediate_action='light.turn_on',
          delayed_action='light.turn_off', delay_seconds=300.\n   - Example \"in 10
          min\": immediate_action=null, delayed_action='switch.turn_off', delay_seconds=600.\n2.
          **\"reminder\"**: Use for notifications (\"remind me about...\", \"tell
          me to...\"). Calculate `delay_seconds` from the current time to the specified
          moment. 3. **\"simple\"**: Use for ALL other cases:\n   - Direct commands
          without timers (\"Turn on the light\").\n   - Complex commands without timers
          (\"Turn on the hood and turn off the light\").\n   - Questions (\"What is
          the temperature?\").\n   - Commands with non-time parameters (\"Set the
          boiler to 20 degrees\").\n\n### FIELD LOGIC: - **immediate_action / immediate_entity**:
          Fill ONLY if an action must be performed RIGHT NOW (e.g., \"turn on FOR
          5 minutes\"). If the command is \"in 10 minutes\", these fields must be
          null. - **delay_seconds**: Integer. If a specific time is mentioned (e.g.,
          \"at 15:00\"), subtract the current time from the target time to get seconds.
          - **delayed_action / delayed_entity**: The action/service and entity to
          be executed after the delay. - **reminder_message**: The text of the reminder
          (only for intent_type=\"reminder\").\n### CRITICAL CONSTRAINTS: - **ENTITY
          SANITIZATION**: Ensure `entity_id` and `action` strings contain ONLY letters,
          numbers, underscores (_), hyphens (-), and dots (.). - **NO HALLUCINATIONS**:
          Do NOT include any closing brackets, braces, or JSON syntax (like `]`, `}`,
          `)`) inside the string values. For example, use 'light.bedroom', NOT 'light.bedroom]}}'.
          - **STRICT MAPPING**: If there is no clear time component or the device
          is not in the list, ALWAYS set intent_type=\"simple\". - **FORMAT**: Use
          full service names: 'light.turn_on', NOT 'turn_on'."
        structure:
          intent_type:
            description: 'Type of the intent: ''command'', ''reminder'' or ''simple'''
            selector:
              select:
                options:
                - command
                - reminder
                - simple
          immediate_action:
            description: Existing Home Assistant action (service) name (e.g., 'light.turn_on')
            selector:
              text:
          immediate_entity:
            description: Real entity for immediate execution
            selector:
              text:
          delay_seconds:
            description: Delay in seconds for delayed execution. Default is 0.
            selector:
              number:
          delayed_action:
            description: Existing Home Assistant action (service) name (e.g., 'switch.turn_off')
            selector:
              text:
          delayed_entity:
            description: Real entity for delayed execution
            selector:
              text:
          reminder_message:
            description: Message for reminder
            selector:
              text:
      response_variable: parsed
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ parsed.data is defined and parsed.data.intent_type in
            [''command'', ''reminder''] }}'
        sequence:
        - action: script.turn_on
          target:
            entity_id: script.ai_smart_executor
          data:
            variables:
              data:
                type: '{{ parsed.data.intent_type }}'
                immediate:
                  action: '{{ parsed.data.immediate_action }}'
                  entity: '{{ parsed.data.immediate_entity | regex_replace(''[^a-z0-9_.]'',
                    '''') if parsed.data.immediate_entity else none }}'
                delayed:
                  delay_seconds: '{{ parsed.data.delay_seconds | default(0) }}'
                  action: '{{ parsed.data.delayed_action }}'
                  entity: '{{ parsed.data.delayed_entity | regex_replace(''[^a-z0-9_.]'',
                    '''') if parsed.data.delayed_entity else none }}'
                  message: '{{ parsed.data.reminder_message }}'
        - set_conversation_response: '- Можливо, я зроблю це для тебе.'
      default:
      - action: conversation.process
        data:
          agent_id: conversation.openai_conversation
          text: '{{ trigger.user_input.text }}'
        response_variable: conv
      - set_conversation_response: "{{\n  conv.response.speech.plain.speech\n  if
          conv is defined\n    and conv.response is defined\n    and conv.response.speech
          is defined\n    and conv.response.speech.plain is defined\n    and conv.response.speech.plain.speech
          is defined\n  else 'Готово.'\n}}"
- id: ai_voice_status_led
  alias: 'System: Voice Assistant LED Status'
  trigger:
  - platform: state
